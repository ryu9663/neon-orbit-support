<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON ORBIT: 궤도 비행 — 개인정보 처리방침</title><style>body{font:17px/1.7 system-ui;max-width:42rem;margin:4rem auto;padding:0 1.4rem;background:#0a1121;color:#eef5ff}a{color:#76fce0}</style><h1>개인정보 처리방침</h1><p>대상: NEON ORBIT: 궤도 비행 (iOS)</p><h2>앱에서 처리하는 정보</h2><p>앱은 회원가입을 요구하지 않으며 개발자에게 개인정보를 전송하지 않습니다. 광고, 추적, 제3자 분석 SDK를 사용하지 않습니다. 최고 점수와 진동 설정은 앱의 기기 내 저장소에만 보관됩니다. 앱을 삭제하면 해당 기기에 저장된 앱 데이터가 제거됩니다.</p><h2>문의</h2><p><a href="./">지원 페이지</a>에서 문의할 수 있습니다. 지원 게시판은 GitHub가 운영하는 별도의 공개 서비스입니다. 게시물에 개인정보를 포함하지 마세요.</p></html>
